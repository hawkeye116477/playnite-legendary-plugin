name: Upload translations to Crowdin

on: 
  workflow_dispatch:
    inputs:
      TRANSLATIONS_UPLOAD:
        description: 'Upload also translations'
        required: true
        type: boolean
        default: false

jobs:
  upload-to-crowdin:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Crowdin Action
      uses: crowdin/github-action@v3
      with:
        upload_sources: true
        upload_translations: ${{ inputs.TRANSLATIONS_UPLOAD }}
        download_translations: false
        config: 'crowdin.yml'
        dryrun_action: false
        project_id: ${{ vars.CROWDIN_PROJECT_ID }}
        token: ${{ secrets.CROWDIN_TOKEN }}
